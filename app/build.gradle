plugins { id 'com.android.application' }

android {
    namespace 'it.dave.beatpilot'
    compileSdk 35
    defaultConfig {
        applicationId 'it.dave.beatpilot'
        minSdk 34
        targetSdk 35
        versionCode 12
        versionName '0.1.11-regressions'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile file('../signing/beatpilot-debug.jks')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { release { minifyEnabled false } }
}
